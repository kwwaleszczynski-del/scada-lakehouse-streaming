[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scada-lakehouse-streaming"
version = "0.1.0"
description = "Simulated wind, PV and meter telemetry pipeline: event-time watermarking for LTE router backfill bursts, Europe/Warsaw DST transition handling, rule-based SCADA sensor QC, Bronze-Silver-Gold Parquet and TimescaleDB continuous-aggregate DDL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scada-lakehouse = "scada_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
